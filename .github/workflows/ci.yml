name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Sync
        run: uv sync
      - name: Ruff
        run: uv run ruff check .
      - name: Node syntax
        run: node --check jev_ultrafast/static/app.js

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Sync
        run: uv sync
      - name: Pytest
        run: uv run pytest
      - name: Build
        run: uv build

  gates:
    name: gates
    if: always()
    needs: [quality, test]
    runs-on: ubuntu-latest
    steps:
      - name: Require upstream jobs green
        run: |
          set -euo pipefail
          test "${{ needs.quality.result }}" = "success"
          test "${{ needs.test.result }}" = "success"
